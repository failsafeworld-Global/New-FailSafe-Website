<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Access Required</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root{ --paper:#F5F7F6; --ink:#13233A; --ink-2:#4A5A70; --rule:#D6DDE3; --amber:#D88A1C; --red:#B3412F; }
  @media (prefers-color-scheme: dark){
    :root{ --paper:#0F1826; --ink:#E6ECF3; --ink-2:#A3B1C2; --rule:#2B3A50; }
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--paper);color:var(--ink);font-family:"Public Sans","Segoe UI",Helvetica,Arial,sans-serif;padding:20px}
  .card{max-width:360px;width:100%;text-align:center}
  h1{font-size:1.3rem;font-weight:700;margin:0 0 8px}
  p{color:var(--ink-2);font-size:0.92rem;margin:0 0 24px}
  input[type="password"]{width:100%;padding:12px 14px;font-size:1rem;border:1px solid var(--rule);border-radius:8px;background:transparent;color:var(--ink);margin-bottom:12px}
  input[type="password"]:focus{outline:2px solid var(--amber);outline-offset:1px}
  button{width:100%;padding:12px 14px;font-size:1rem;font-weight:600;border:none;border-radius:8px;background:var(--ink);color:var(--paper);cursor:pointer}
  button:hover{opacity:0.9}
  button:disabled{opacity:0.5;cursor:default}
  .error{color:var(--red);font-size:0.88rem;margin-top:12px;min-height:1.2em}
</style>
</head>

  </form>
</div>

const ITERATIONS = 250000;

function b64ToBytes(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

async function tryUnlock(password) {
  const enc = new TextEncoder();
  const salt = b64ToBytes(SALT_B64);
  const iv = b64ToBytes(IV_B64);
  const ct = b64ToBytes(CT_B64);

  const keyMaterial = await crypto.subtle.importKey(
    "raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]
  );
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: salt, iterations: ITERATIONS, hash: "SHA-256" },
    keyMaterial,
    { name: "AES-GCM", length: 256 },
    false,
    ["decrypt"]
  );
  const plainBuf = await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, ct);
  return new TextDecoder().decode(plainBuf);
}

const form = document.getElementById('gate');
const errEl = document.getElementById('err');
const btn = document.getElementById('btn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const pw = document.getElementById('pw').value;
  if (!pw) return;
  btn.disabled = true;
  errEl.textContent = '';
  try {
    const html = await tryUnlock(pw);
    document.open();
    document.write(html);
    document.close();
  } catch (err) {
    errEl.textContent = 'Incorrect password.';
    btn.disabled = false;
    document.getElementById('pw').value = '';
    document.getElementById('pw').focus();
  }
});
</script>
